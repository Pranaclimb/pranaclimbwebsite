<svg viewBox="0 0 900 780" xmlns="http://www.w3.org/2000/svg" font-family="Outfit, -apple-system, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f5f2"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#f5f5f2"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#d8d8d0" stroke-width="3"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="900" height="780" fill="url(#bgGrad3)"/>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a1a">Personal Trajectory: Reset · Flow · Reach</text>
  <text x="450" y="66" text-anchor="middle" font-size="14" fill="#555555">How Pranaclimb describes movement relative to your own established pattern — after a baseline is formed</text>

  <!-- Plot area -->
  <g transform="translate(90,160)">
    <!-- Baseline Forming zone (sessions 1-4, hatched, no colour bands yet) -->
    <rect x="0" y="0" width="272" height="380" fill="url(#hatch)"/>
    <line x1="272" y1="0" x2="272" y2="380" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="4,4"/>

    <!-- Zone bands (from session 5 onward) -->
    <rect x="272" y="0" width="408" height="90" fill="#ff00ff" opacity="0.08"/>
    <rect x="272" y="90" width="408" height="140" fill="#AAFF00" opacity="0.18"/>
    <rect x="272" y="230" width="408" height="150" fill="#89CFF0" opacity="0.12"/>
    <line x1="272" y1="90" x2="680" y2="90" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.4"/>
    <line x1="272" y1="230" x2="680" y2="230" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.4"/>

    <!-- Baseline Forming label -->
    <text x="136" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#4a4a4a" transform="rotate(-90 136 200)">BASELINE FORMING</text>

    <!-- Zone labels -->
    <text x="290" y="26" font-size="13.5" font-weight="700" fill="#c400c4">REACH</text>
    <text x="290" y="115" font-size="13.5" font-weight="700" fill="#5a8a00">FLOW</text>
    <text x="290" y="252" font-size="13.5" font-weight="700" fill="#3a8fc4">RESET</text>

    <!-- Axes -->
    <line x1="0" y1="380" x2="680" y2="380" stroke="#4a4a4a" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="380" stroke="#4a4a4a" stroke-width="2"/>

    <!-- Y axis label -->
    <text x="-58" y="190" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="600" transform="rotate(-90 -58 190)">Observed result (illustrative)</text>

    <!-- X axis labels: sessions -->
    <g font-size="12.5" fill="#555555" text-anchor="middle">
      <text x="34" y="400">S1</text>
      <text x="102" y="400">S2</text>
      <text x="170" y="400">S3</text>
      <text x="238" y="400">S4</text>
      <text x="306" y="400">S5</text>
      <text x="374" y="400">S6</text>
      <text x="442" y="400">S7</text>
      <text x="510" y="400">S8</text>
      <text x="578" y="400">S9</text>
      <text x="646" y="400">S10</text>
    </g>
    <text x="340" y="430" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="600">Session (same time of day, same standardised procedure)</text>

    <!-- Data line -->
    <polyline points="34,200 102,215 170,190 238,205 306,175 374,160 442,195 510,60 578,155 646,300"
              fill="none" stroke="#1a1a1a" stroke-width="2" opacity="0.55"/>

    <!-- Baseline Forming dots (grey, sessions 1-4) -->
    <circle cx="34" cy="200" r="7" fill="#c7c7c0" stroke="#1a1a1a" stroke-width="1.5"/>
    <circle cx="102" cy="215" r="7" fill="#c7c7c0" stroke="#1a1a1a" stroke-width="1.5"/>
    <circle cx="170" cy="190" r="7" fill="#c7c7c0" stroke="#1a1a1a" stroke-width="1.5"/>
    <circle cx="238" cy="205" r="7" fill="#c7c7c0" stroke="#1a1a1a" stroke-width="1.5"/>

    <!-- Trajectory dots (coloured, sessions 5-10) -->
    <circle cx="306" cy="175" r="7" fill="#AAFF00" stroke="#1a1a1a" stroke-width="1.5"/>
    <circle cx="374" cy="160" r="7" fill="#AAFF00" stroke="#1a1a1a" stroke-width="1.5"/>
    <circle cx="442" cy="195" r="7" fill="#AAFF00" stroke="#1a1a1a" stroke-width="1.5"/>
    <circle cx="510" cy="60" r="8" fill="#ff00ff" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="578" cy="155" r="7" fill="#AAFF00" stroke="#1a1a1a" stroke-width="1.5"/>
    <circle cx="646" cy="300" r="8" fill="#89CFF0" stroke="#1a1a1a" stroke-width="2"/>

    <!-- Callout: Baseline Forming (S1-S4) -->
    <rect x="4" y="460" width="264" height="60" rx="6" fill="#ffffff" stroke="#c7c7c0" stroke-width="1.5"/>
    <text x="136" y="480" text-anchor="middle" font-size="12" font-weight="700" fill="#4a4a4a">Baseline Forming</text>
    <text x="136" y="496" text-anchor="middle" font-size="11" fill="#555555">Record result and conditions —</text>
    <text x="136" y="510" text-anchor="middle" font-size="11" fill="#555555">no trajectory assigned yet</text>

    <!-- Callout: Reach (S8) -->
    <line x1="510" y1="60" x2="510" y2="-18" stroke="#c400c4" stroke-width="1.5"/>
    <rect x="392" y="-72" width="236" height="54" rx="6" fill="#ffffff" stroke="#ff00ff" stroke-width="1.5"/>
    <text x="510" y="-52" text-anchor="middle" font-size="12" font-weight="700" fill="#c400c4">Reach</text>
    <text x="510" y="-38" text-anchor="middle" font-size="11" fill="#555555">Note the progression — look for transfer</text>
    <text x="510" y="-24" text-anchor="middle" font-size="11" fill="#555555">into breathing control and climbing</text>

    <!-- Callout: Reset (S10) -->
    <line x1="646" y1="300" x2="646" y2="460" stroke="#3a8fc4" stroke-width="1.5"/>
    <rect x="500" y="460" width="264" height="60" rx="6" fill="#ffffff" stroke="#89CFF0" stroke-width="1.5"/>
    <text x="632" y="480" text-anchor="middle" font-size="12" font-weight="700" fill="#3a8fc4">Reset</text>
    <text x="632" y="496" text-anchor="middle" font-size="11" fill="#555555">Review recent context — sleep, exertion,</text>
    <text x="632" y="510" text-anchor="middle" font-size="11" fill="#555555">stress — alongside Raw BR, RPE, HRR₆₀</text>
  </g>

  <!-- Footer strip -->
  <rect x="0" y="700" width="900" height="80" fill="#1a1a1a"/>
  <text x="450" y="728" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="600">Flow is the default, stable state — most consistent observations should sit here.</text>
  <text x="450" y="748" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="600">Reset and Reach are prompts to look closer, not verdicts on fitness.</text>
  <text x="450" y="768" text-anchor="middle" font-size="11" fill="#AAFF00" font-weight="700" letter-spacing="0.15em">PRANACLIMB · PERSONAL TRAJECTORY</text>
</svg>
