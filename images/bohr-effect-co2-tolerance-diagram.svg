<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Outfit, -apple-system, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f5f2"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <marker id="arrowPink" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ff00ff"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="620" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a1a">The Bohr Effect: Why Working Muscle Gets More O₂</text>
  <text x="450" y="66" text-anchor="middle" font-size="14" fill="#555555">Oxygen–haemoglobin dissociation curve — how rising CO₂ and falling pH shift O₂ release</text>

  <!-- Plot area -->
  <g transform="translate(90,100)">
    <!-- Axes -->
    <line x1="0" y1="380" x2="680" y2="380" stroke="#4a4a4a" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="380" stroke="#4a4a4a" stroke-width="2"/>

    <!-- Gridlines -->
    <g stroke="#e0e0d8" stroke-width="1">
      <line x1="0" y1="76" x2="680" y2="76"/>
      <line x1="0" y1="152" x2="680" y2="152"/>
      <line x1="0" y1="228" x2="680" y2="228"/>
      <line x1="0" y1="304" x2="680" y2="304"/>
      <line x1="136" y1="0" x2="136" y2="380"/>
      <line x1="272" y1="0" x2="272" y2="380"/>
      <line x1="408" y1="0" x2="408" y2="380"/>
      <line x1="544" y1="0" x2="544" y2="380"/>
      <line x1="680" y1="0" x2="680" y2="380"/>
    </g>

    <!-- Y axis labels -->
    <text x="-12" y="384" text-anchor="end" font-size="13" fill="#555555">0</text>
    <text x="-12" y="308" text-anchor="end" font-size="13" fill="#555555">25</text>
    <text x="-12" y="232" text-anchor="end" font-size="13" fill="#555555">50</text>
    <text x="-12" y="156" text-anchor="end" font-size="13" fill="#555555">75</text>
    <text x="-12" y="80" text-anchor="end" font-size="13" fill="#555555">100</text>
    <text x="-58" y="190" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="600" transform="rotate(-90 -58 190)">Hb O₂ Saturation (%)</text>

    <!-- X axis labels -->
    <text x="0" y="402" text-anchor="middle" font-size="13" fill="#555555">0</text>
    <text x="136" y="402" text-anchor="middle" font-size="13" fill="#555555">20</text>
    <text x="272" y="402" text-anchor="middle" font-size="13" fill="#555555">40</text>
    <text x="408" y="402" text-anchor="middle" font-size="13" fill="#555555">60</text>
    <text x="544" y="402" text-anchor="middle" font-size="13" fill="#555555">80</text>
    <text x="680" y="402" text-anchor="middle" font-size="13" fill="#555555">100</text>
    <text x="340" y="428" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="600">Partial Pressure of O₂ — PO₂ (mmHg)</text>

    <!-- Curve 1: Normal / Lungs (left-shifted, higher affinity) -->
    <path d="M 0,378 C 60,376 110,368 150,330 C 190,285 210,190 240,120 C 270,70 320,45 400,35 C 500,25 600,20 680,18"
          fill="none" stroke="#89CFF0" stroke-width="4"/>

    <!-- Curve 2: Working muscle (right-shifted, Bohr effect: higher CO2, lower pH, higher temp) -->
    <path d="M 0,379 C 70,377 130,368 175,335 C 220,295 250,225 290,155 C 330,95 390,55 470,35 C 550,20 620,16 680,15"
          fill="none" stroke="#ff00ff" stroke-width="4"/>

    <!-- Working-muscle tissue PO2 reference line (~20-40 mmHg typical) -->
    <line x1="204" y1="0" x2="204" y2="380" stroke="#AAFF00" stroke-width="2" stroke-dasharray="6,5"/>
    <text x="204" y="-8" text-anchor="middle" font-size="12" fill="#4a4a4a" font-weight="600">Typical working-muscle PO₂</text>

    <!-- Points showing the O2 unloading gap at tissue PO2 -->
    <circle cx="204" cy="253" r="6" fill="#89CFF0" stroke="#1a1a1a" stroke-width="1.5"/>
    <circle cx="204" cy="335" r="6" fill="#ff00ff" stroke="#1a1a1a" stroke-width="1.5"/>

    <!-- Bracket showing extra O2 released -->
    <line x1="230" y1="253" x2="230" y2="335" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arrowPink)" marker-end="url(#arrowPink)"/>
    <text x="242" y="285" font-size="12.5" fill="#1a1a1a" font-weight="700">Extra O₂</text>
    <text x="242" y="301" font-size="12.5" fill="#1a1a1a" font-weight="700">unloaded to</text>
    <text x="242" y="317" font-size="12.5" fill="#1a1a1a" font-weight="700">muscle</text>

    <!-- Curve labels -->
    <text x="430" y="42" font-size="14" fill="#3a8fc4" font-weight="700">Lungs — high pH, low CO₂, low temp</text>
    <text x="420" y="230" font-size="14" fill="#c400c4" font-weight="700">Working muscle — ↓pH, ↑CO₂, ↑temp</text>
    <text x="480" y="250" font-size="13" fill="#c400c4">(curve shifts right — the Bohr Effect)</text>
  </g>

  <!-- Footer strip -->
  <rect x="0" y="550" width="900" height="70" fill="#1a1a1a"/>
  <text x="450" y="578" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="600">As CO₂ and H⁺ rise in working muscle, haemoglobin's grip on O₂ loosens —</text>
  <text x="450" y="598" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="600">releasing more oxygen exactly where it's needed.</text>
  <text x="450" y="614" text-anchor="middle" font-size="11" fill="#AAFF00" font-weight="700" letter-spacing="0.15em">PRANACLIMB · CO₂ TOLERANCE &amp; PHYSIOLOGY</text>
</svg>
